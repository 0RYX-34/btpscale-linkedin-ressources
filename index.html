<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex,nofollow'><title>BTPScale</title><style>:root{--creme:#F4F0E8;--encre:#26262A;--ambre:#8A5A0F;--carte:#FFFFFF;--gris:#6B6B72}
*{box-sizing:border-box}body{font-family:'Avenir Next',Inter,-apple-system,Arial,sans-serif;
background:var(--creme);color:var(--encre);margin:0;padding:48px 20px;line-height:1.6}
main{max-width:660px;margin:0 auto}.sur{font-size:13px;letter-spacing:.12em;text-transform:uppercase;
color:var(--ambre);font-weight:600;margin:0 0 12px}h1{font-size:34px;line-height:1.2;margin:0 0 20px;
font-weight:700}p{margin:0 0 18px}ul{padding-left:0;list-style:none;margin:0 0 28px}
li{background:var(--carte);border-left:3px solid var(--ambre);padding:12px 16px;margin:0 0 8px;
border-radius:0 6px 6px 0}.tel{display:inline-block;background:var(--encre);color:var(--creme);
text-decoration:none;padding:14px 22px;border-radius:8px;font-weight:600;margin:0 10px 12px 0}
.tel.second{background:transparent;color:var(--encre);border:2px solid var(--encre)}
footer{margin-top:40px;padding-top:20px;border-top:1px solid #D9D4CA;color:var(--gris);font-size:14px}
@media(prefers-color-scheme:dark){:root{--creme:#1C1C20;--encre:#EDE9E1;--carte:#26262C;
--ambre:#D9921E;--gris:#9A9AA2}}</style></head><body><main><p class='sur'>BTPScale</p><h1>Rien à voir ici</h1><p>Les ressources de la série se reçoivent par message, après un commentaire sous le post qui les annonce.</p></main></body></html>
